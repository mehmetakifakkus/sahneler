<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İzometrik Şehir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* One visual world: the map is the page; a dark glass panel floats over it.
   Accent = Ankara taxi yellow. */
:root {
  --ink: #0f1317;
  --panel: rgba(17, 21, 26, 0.84);
  --line: rgba(232, 228, 218, 0.12);
  --text: #ece8de;
  --muted: #9da6ab;
  --accent: #ecb428;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font-family: var(--font-body); overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#gl.drag { cursor: grabbing; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; transform-origin: 0 0; white-space: nowrap; font-weight: 600; font-size: 12px;
  letter-spacing: 0.01em; color: #1b1f24; background: rgba(250, 247, 240, 0.9); padding: 3px 7px; border-radius: 3px;
  box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.lbl.minor { font-weight: 500; font-size: 11px; padding: 2px 6px; }
.lbl.poi::after, .lbl.minor::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -4px; border: 4px solid transparent;
  border-top-color: rgba(250, 247, 240, 0.9); border-bottom: 0; }
.lbl.square { background: var(--accent); color: #1b1f24; }
.lbl.square::after { border-top-color: var(--accent); }
.lbl.water { background: none; box-shadow: none; color: #dff0ff; font-style: italic; font-weight: 500; font-size: 15px;
  letter-spacing: 0.12em; text-shadow: 0 1px 3px rgba(10,40,80,.9); padding: 0; }
.lbl.street { background: none; box-shadow: none; color: rgba(255,255,255,.92); font-weight: 500; font-size: 11px;
  text-shadow: 0 0 3px #222, 0 0 2px #222, 0 1px 2px #000; padding: 0; }

.panel { position: fixed; top: 16px; left: 16px; width: min(330px, calc(100vw - 32px)); background: var(--panel);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 16px 14px; display: grid; gap: 12px; box-sizing: border-box; }
.panel h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.panel h1 span { color: var(--accent); }
.sub { margin: 2px 0 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12.5px var(--font-body); color: var(--text); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 11px 6px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); box-sizing: border-box; }
.chip[aria-pressed="true"] { border-color: rgba(236, 180, 40, .55); background: rgba(236, 180, 40, .12); }
.chip[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg.two { grid-template-columns: 1fr 1fr; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button { font: 500 12.5px var(--font-body); color: var(--muted); background: transparent; border: 0; padding: 7px 4px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { color: #1b1f24; background: var(--text); }
.chip:focus-visible, .seg button:focus-visible, .zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: none; grid-template-columns: repeat(2, 1fr); gap: 4px 10px; font-size: 11.5px; color: var(--muted); }
.legend.on { display: grid; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.ramp { display: none; font: 11px var(--font-mono); color: var(--muted); }
.ramp.on { display: grid; gap: 4px; }
.ramp div:first-child { height: 8px; border-radius: 2px; background: linear-gradient(90deg, #141a24, #6d5a4a, #ffd98c); }
.ramp div:last-child { display: flex; justify-content: space-between; }
.stats { display: flex; justify-content: space-between; align-items: end; font: 11px var(--font-mono); color: var(--muted);
  font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); padding-top: 10px; }
.scale { display: grid; gap: 3px; }
.scale b { display: block; height: 4px; border: 1.5px solid var(--muted); border-top: 0; }
.note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
.note strong { color: var(--text); font-weight: 600; }
.zoom { position: fixed; right: 16px; top: 16px; display: grid; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.zoom button { width: 36px; height: 34px; font: 500 18px var(--font-body); color: var(--text); background: transparent; border: 0; cursor: pointer; }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button svg { display: block; margin: auto; }
.zoom button[aria-expanded="true"] { color: var(--accent); }
.shotwin { position: fixed; right: 16px; top: 128px; width: 280px; z-index: 7; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 12px; color: var(--text); box-shadow: 0 10px 28px rgba(0,0,0,.35);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 12.5px; }
.shotwin[hidden] { display: none; }
.shotwin header { display: flex; align-items: center; justify-content: space-between; }
.shotwin h3 { margin: 0; font: 600 14px var(--font-body); }
.shotwin #sw-close { background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; }
.sw-row { display: flex; flex-direction: column; gap: 6px; }
.sw-h { font: 500 11px var(--font-mono); color: var(--muted); }
.sw-row small { color: var(--muted); font: 500 11px var(--font-mono); }
.sw-go { font: 600 13px var(--font-body); color: #1b1f24; background: var(--accent); border: 0; border-radius: 7px; padding: 9px; cursor: pointer; }
.sw-go:disabled { opacity: .45; cursor: not-allowed; }
.shotwin.busy .sw-go { opacity: .5; pointer-events: none; }
.sw-chk { display: flex; gap: 7px; align-items: center; color: var(--muted); cursor: pointer; }
#sw-status { margin: 0; min-height: 1em; font: 500 11.5px var(--font-mono); color: var(--accent); }
#sw-status:empty { display: none; }
.attr { position: fixed; right: 10px; bottom: 8px; font-size: 11px; color: rgba(255,255,255,.85); text-shadow: 0 1px 2px #000; }
.attr a { color: inherit; }
#load { position: fixed; inset: 0; display: grid; place-items: center; font: 13px var(--font-mono); color: var(--muted); pointer-events: none; }
#load.err { color: #f2a28f; pointer-events: auto; padding: 24px; text-align: center; }
.collapse { display: none; }
.viewrow { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.viewrow button { height: 32px; font: 500 16px var(--font-body); color: var(--text); background: transparent; border: 0; cursor: pointer; }
.viewrow button:hover { background: rgba(255,255,255,.06); }
.viewrow span { text-align: center; font-size: 12.5px; color: var(--text); border-left: 1px solid var(--line); border-right: 1px solid var(--line); line-height: 32px; }
.viewrow button:disabled, .seg button:disabled { opacity: .4; cursor: not-allowed; }
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.games button { font: 600 12.5px var(--font-body); color: #1b1f24; background: var(--accent); border: 0; border-radius: 7px; padding: 8px 6px; cursor: pointer; }
.games button[aria-pressed="true"] { background: var(--text); }
.game { position: fixed; right: 16px; top: 100px; width: min(340px, calc(100vw - 32px)); background: var(--panel);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px; display: grid; gap: 10px; box-sizing: border-box; z-index: 5; }
.game[hidden] { display: none; }
.game h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.game h2 small { font: 500 11.5px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.game p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
.game p b { color: var(--text); }
.game canvas { width: 100%; aspect-ratio: 16 / 11; border-radius: 6px; background: #111; display: block; image-rendering: pixelated; }
.game .acts { display: flex; gap: 6px; justify-content: flex-end; }
.game .acts button { font: 600 12.5px var(--font-body); border-radius: 7px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
.game .acts button.primary { background: var(--accent); color: #1b1f24; border-color: var(--accent); }
.game .acts button:disabled { opacity: .45; cursor: not-allowed; }
.game .big { font: 700 26px var(--font-body); color: var(--accent); font-variant-numeric: tabular-nums; }
.game .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.game .bar i { display: block; height: 100%; background: var(--accent); }
#pins { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
#pins svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pin { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -18px 0 0 -9px; }
.pin::before { content: ""; position: absolute; inset: 0; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.pin.guess::before { background: #3b82f6; }
.pin.target::before { background: #e5484d; }
#crosshair { position: fixed; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 2px dashed rgba(255,255,255,.85);
  border-radius: 50%; pointer-events: none; z-index: 2; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
#crosshair[hidden] { display: none; }
.search { position: relative; }
.search input { width: 100%; box-sizing: border-box; font: 500 13px var(--font-body); color: var(--text); background: rgba(255,255,255,.06);
  border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search ul { position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: #161b21;
  border: 1px solid var(--line); border-radius: 8px; z-index: 8; max-height: 300px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.search ul[hidden] { display: none; }
.search li { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 7px 8px 7px 20px; border-radius: 5px;
  font-size: 13px; cursor: pointer; position: relative; }
.search li::before { content: ""; position: absolute; left: 7px; top: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--cc, #888); }
.search li:hover { background: rgba(255,255,255,.07); }
.search li small { color: var(--muted); font-size: 11px; white-space: nowrap; }
.search li.none { color: var(--muted); cursor: default; padding-left: 8px; }
.search li.none::before { display: none; }
.cats { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.cats[hidden] { display: none; }
.cats-h { font: 500 11px var(--font-mono); color: var(--muted); width: 100%; text-align: left; background: none; border: 0; padding: 0 0 2px; cursor: pointer; }
.cats-h span { display: inline-block; transition: transform .15s; }
.cats.closed .cats-h span { transform: rotate(-90deg); }
.cats.closed .cat { display: none; }
.lbl.link { pointer-events: auto; cursor: pointer; }
.cat { font: 500 11.5px var(--font-body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 9px 4px 7px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.cat::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--cc); opacity: .45; }
.cat small { font: 500 10px var(--font-mono); opacity: .7; }
.cat[aria-pressed="true"] { color: var(--text); border-color: color-mix(in srgb, var(--cc) 55%, transparent); background: color-mix(in srgb, var(--cc) 14%, transparent); }
.cat[aria-pressed="true"]::before { opacity: 1; }
.cat.more::before { display: none; }
.cat.more { padding-left: 9px; }
.cat.more .chev { display: inline-block; transition: transform .15s; font-size: 10px; }
.cat.more[aria-expanded="true"] { color: var(--text); border-color: var(--muted); }
.cat.more[aria-expanded="true"] .chev { transform: rotate(180deg); }
.cats-rest { display: flex; flex-wrap: wrap; gap: 5px; width: 100%; padding: 6px 0 0 8px; border-left: 2px solid var(--line); margin-left: 2px; }
.cats-rest[hidden] { display: none; }
.cats.closed .cats-rest, .cats.closed .cat.more { display: none; }
.lbl.feat { pointer-events: auto; cursor: pointer; border: 0; font: 600 11px var(--font-body); padding: 2px 7px 2px 16px; background: rgba(250,247,240,.92); }
.lbl.feat::before { content: ""; position: absolute; left: 6px; top: 50%; margin-top: -3.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--cc); }
.lbl.feat:hover { background: #fff; }
.game.info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12.5px; }
.game.info dt { color: var(--muted); }
.game.info dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.game.info a { color: var(--accent); }
.game.info .est { color: var(--muted); font-size: 11px; }
.game.info { max-height: calc(100vh - 80px); overflow-y: auto; }
.game.info .acts { align-items: center; justify-content: space-between; }
.game.info .acts a { font-size: 12px; }
.game.info .chip-c { margin: 0; font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; }
.chip-c::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--cc); }
.near { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.near span { font: 500 11px var(--font-mono); color: var(--muted); width: 100%; }
.near button { font: 500 11.5px var(--font-body); color: var(--text); background: rgba(255,255,255,.05); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 9px 4px 8px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.near button::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cc); }
.near small { color: var(--muted); font-size: 10.5px; }
.pin.sel::before { background: var(--accent); }
.editbar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 9; display: flex; gap: 10px; align-items: center;
  background: #2a2412; color: #f4e7c0; border: 1px solid #8a6d1d; border-radius: 10px; padding: 7px 8px 7px 14px; font: 500 12.5px var(--font-body);
  box-shadow: 0 6px 20px rgba(0,0,0,.35); max-width: calc(100vw - 24px); flex-wrap: wrap; }
.editbar b { color: var(--accent); }
.editbar .eb-hint { color: #cdbd90; }
.editbar #e-count { font: 500 11px var(--font-mono); color: #cdbd90; }
.editbar button { font: 600 12px var(--font-body); color: #1d1a10; background: var(--accent); border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.editbar #e-clear, .editbar #e-exit { background: transparent; color: #f4e7c0; border: 1px solid #8a6d1d; }
@media (max-width: 560px) { .editbar { top: 8px; left: 10px; right: 10px; transform: none; gap: 5px; padding: 6px 8px; flex-wrap: nowrap; overflow-x: auto; }
  .editbar .eb-hint, .editbar #e-count { display: none; } .editbar button { padding: 5px 8px; white-space: nowrap; font-size: 11.5px; }
  .editing .game.info { top: 56px; max-height: 38vh; } }
.game.info .sub { margin: -4px 0 0; color: var(--muted); font-size: 11.5px; }
.game.info .fld { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--muted); }
.game.info .fld input, .game.info .fld select, .game.info .fld textarea { font: 500 13px var(--font-body); color: var(--text); background: rgba(255,255,255,.06);
  border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; outline: none; resize: vertical; }
.game.info .fld select option { background: #161b21; }
.game.info .fld :focus { border-color: var(--accent); }
.game.info .linkbtn { background: none; border: 0; color: var(--accent); font-size: 12px; text-align: left; padding: 0; cursor: pointer; }
.game.info .acts .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.toast { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); background: var(--accent); color: #1b1f24; font: 700 13px var(--font-body);
  padding: 8px 14px; border-radius: 999px; z-index: 6; box-shadow: 0 4px 14px rgba(0,0,0,.35); pointer-events: none; transition: opacity .4s; }
@media (max-width: 560px) { .game { top: 56px; right: 10px; width: calc(100vw - 20px); } .game.info { top: 10px; max-height: 34vh; overflow-y: auto; gap: 8px; } }
@media (max-width: 560px) {
  .panel { top: auto; bottom: 30px; left: 10px; width: calc(100vw - 20px); padding: 12px; gap: 10px; }
  .panel .note, .panel .sub { display: none; }
  .zoom { top: 10px; right: 10px; }
  .shotwin { top: 116px; right: 10px; width: min(280px, calc(100vw - 20px)); }
}
</style>
</head>
<body>
<div id="labels"></div>
<div id="pins"><svg aria-hidden="true"><line id="gline" stroke="#fff" stroke-width="2.5" stroke-dasharray="6 5" x1="0" y1="0" x2="0" y2="0" visibility="hidden"/></svg></div>
<div id="crosshair" hidden></div>
<section class="game" id="game" hidden aria-live="polite"></section>
<section class="game info" id="info" hidden aria-live="polite"></section>

<section class="panel" aria-label="Harita kontrolleri">
  <div class="seg three" role="group" aria-label="Harita">
    <button data-city="kizilay" aria-pressed="false" title="Ankara · Kızılay">Kızılay</button>
    <button data-city="odtu" aria-pressed="false" title="Ankara · ODTÜ kampüsü">ODTÜ</button>
    <button data-city="istanbul" aria-pressed="false" title="İstanbul · Eminönü, Galata, Taksim, Sultanahmet">İstanbul</button>
  </div>
  <div class="viewrow" role="group" aria-label="Bakış yönü">
    <button id="v-left" aria-label="Kamerayı sola döndür" title="Sola döndür (Q)">⟲</button>
    <span id="v-name">&nbsp;</span>
    <button id="v-right" aria-label="Kamerayı sağa döndür" title="Sağa döndür (E)">⟳</button>
  </div>
  <div>
    <h1 id="title">&nbsp;</h1>
    <p class="sub" id="sub">&nbsp;</p>
  </div>
  <div class="row" role="group" aria-label="Efektler">
    <button class="chip" id="t-traffic" aria-pressed="true">Trafik</button>
    <button class="chip" id="t-tilt" aria-pressed="true">Tilt-shift</button>
    <button class="chip" id="t-anim" aria-pressed="true">Ağaç ve su</button>
    <button class="chip" id="t-labels" aria-pressed="true">Etiketler</button>
  </div>
  <div class="seg" role="group" aria-label="Katman">
    <button id="m-0" aria-pressed="true">Renk</button>
    <button id="m-1" aria-pressed="false">Yükseklik</button>
    <button id="m-2" aria-pressed="false">Materyal</button>
  </div>
  <div class="ramp" id="ramp"><div></div><div><span>0 m</span><span>45 m</span><span>90 m</span></div></div>
  <div class="legend" id="legend"></div>
  <div class="search">
    <input id="q" type="search" placeholder="Yer ara: kütüphane, yurt, kafe…" autocomplete="off" aria-label="Haritada yer ara">
    <ul id="qres" role="listbox" hidden></ul>
  </div>
  <div class="cats" id="cats" role="group" aria-label="Yer kategorileri" hidden></div>
  <div class="games" role="group" aria-label="Oyunlar">
    <button id="g-where" aria-pressed="false">Burası neresi?</button>
    <button id="g-explore" aria-pressed="false">Keşif</button>
  </div>
  <p class="note"><strong>Stil geçişi henüz yok.</strong> Gördüğün, piksel art modelinin girdisi olacak geometri geçişi: binalar, gölgeler, yükseklik ve materyal maskeleri.</p>
  <div class="stats">
    <span id="cars">0 araç</span>
    <span class="scale"><span id="scale-txt">50 m</span><b id="scale-bar" style="width:60px"></b></span>
  </div>
</section>

<div class="zoom" role="group" aria-label="Yakınlaştırma">
  <button id="z-in" aria-label="Yakınlaştır">+</button>
  <button id="z-out" aria-label="Uzaklaştır">−</button>
  <button id="z-shot" aria-label="Fotoğraf ve video" aria-expanded="false" title="Fotoğraf ve video"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg></button>
</div>
<section class="shotwin" id="shotwin" hidden aria-label="Fotoğraf ve video">
  <header><h3>Fotoğraf ve video</h3><button id="sw-close" aria-label="Kapat">×</button></header>
  <div class="sw-row">
    <span class="sw-h">Fotoğraf · PNG</span>
    <div class="seg three" id="sw-scale"><button data-k="2" aria-pressed="false">2×</button><button data-k="3" aria-pressed="true">3×</button><button data-k="4" aria-pressed="false">4×</button></div>
    <small id="sw-dims"></small>
    <button class="sw-go" id="sw-photo">Fotoğraf çek</button>
  </div>
  <div class="sw-row">
    <span class="sw-h">Video · 4 saniye</span>
    <div class="seg" id="sw-motion" style="grid-template-columns:repeat(4,1fr)"><button data-m="still" aria-pressed="true">Sabit</button><button data-m="zoom" aria-pressed="false">Yakınlaş</button><button data-m="pan" aria-pressed="false">Kaydır</button><button data-m="orbit" aria-pressed="false">Süzül</button></div>
    <small id="sw-vfmt"></small>

  <p id="sw-status" aria-live="polite"></p>
</section>
<div class="attr">Harita verisi © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap katkıcıları</a> (ODbL)</div>

<script>
"use strict";
// cities.json: city -> {views: [{h, base}], start}; each view folder holds scene.json + tile pyramid
let CITIES = null;
let GAME_MODE = null;      // survives view switches (explore mode)
let current = null;
const DIRS = { 0: "Kuzeye", 45: "Kuzeydoğuya", 90: "Doğuya", 135: "Güneydoğuya", 180: "Güneye", 225: "Güneybatıya", 270: "Batıya", 315: "Kuzeybatıya" };
function parseHash() {
  const [c, h] = location.hash.slice(1).split("-");
  const city = CITIES && c in CITIES ? c : (CITIES && "odtu" in CITIES ? "odtu" : Object.keys(CITIES)[0]);
  const views = CITIES[city].views;
  let vi = views.findIndex((v) => String(v.h) === h);
  if (vi < 0) vi = CITIES[city].start || 0;
  return [city, vi];
}
function setHash(city, vi) {
  const v = CITIES[city].views[vi], tag = vi === (CITIES[city].start || 0) ? city : `${city}-${v.h}`;
  try { history.replaceState(null, "", "#" + tag); } catch (e) {}
}
function switchTo(city, vi, keep) {
  const keepView = keep || null;
  if (current) current.stop();
  document.querySelectorAll("[data-city]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.city === city)));
  document.getElementById("v-name").textContent = `${DIRS[CITIES[city].views[vi].h] || CITIES[city].views[vi].h + "°"} bakış`;
  const single = CITIES[city].views.length < 2;
  document.querySelectorAll("#v-left, #v-right").forEach((b) => { b.disabled = single; b.title = single ? "Bu haritada tek bakış açısı var" : b.title; });
  boot(city, vi, keepView);
}
function rotate(step) {
  if (!current || current.busy) return;
  const n = CITIES[current.city].views.length; if (n < 2) return;
  const vi = (current.vi + step + n) % n;
  setHash(current.city, vi); switchTo(current.city, vi, current.worldView());
}
document.querySelectorAll("[data-city]").forEach((b) => b.addEventListener("click", () => {
  if (!CITIES || b.dataset.city === current?.city || current?.busy) return;
  const vi = CITIES[b.dataset.city].start || 0;
  setHash(b.dataset.city, vi); switchTo(b.dataset.city, vi);
}));
document.getElementById("v-left").addEventListener("click", () => rotate(-1));
document.getElementById("v-right").addEventListener("click", () => rotate(1));
window.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input, textarea, select")) return;
  if (e.key === "q" || e.key === "Q") rotate(-1); else if (e.key === "e" || e.key === "E") rotate(1);
});
window.addEventListener("hashchange", () => {
  if (!CITIES) return;
  const [c, vi] = parseHash();
  if (c !== current?.city || vi !== current?.vi) switchTo(c, vi, c === current?.city ? current.worldView() : null);
});

async function boot(city, vi, keep) {
if (location.protocol === "file:") {
  const d = document.createElement("div"); d.id = "load"; d.className = "err";
  d.innerHTML = "Bu sayfa dosyadan açıldığı için tarayıcı harita dosyalarını okuyamıyor.<br><br>" +
    "Klasördeki <b>sunucu.command</b> (Mac), <b>sunucu.bat</b> (Windows) veya <b>sunucu.sh</b> (Linux) ile açın,<br>" +
    "ya da klasörde <code>python3 -m http.server 8000</code> çalıştırıp <b>http://localhost:8000</b> adresine gidin.";
  document.body.appendChild(d); return;
}
const BASE = CITIES[city].views[vi].base;
const $ = (id) => document.getElementById(id);
let alive = true;
const loadEl = document.createElement("div"); loadEl.id = "load"; loadEl.textContent = "Harita yükleniyor…";
document.body.appendChild(loadEl);
const fail = (msg) => { loadEl.textContent = msg; loadEl.classList.add("err"); };
const canvas = document.createElement("canvas"); canvas.id = "gl";
canvas.setAttribute("aria-label", "İzometrik harita. Sürükleyerek kaydırın, tekerlek veya iki parmakla yakınlaştırın.");
document.body.prepend(canvas);
$("labels").innerHTML = "";
let gl = null;
let worldView = () => keep;          // replaced once the scene is loaded
let gameStop = () => {};
current = { city, vi, busy: false, worldView: () => worldView(), stop() {
  alive = false; loadEl.remove(); gameStop();
  try { gl && gl.getExtension("WEBGL_lose_context")?.loseContext(); } catch (e) {}
  canvas.remove(); $("labels").innerHTML = "";
} };
gl = canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: false, alpha: false });
if (!gl) { fail("Bu tarayıcı WebGL2 desteklemiyor. Güncel bir Chrome, Firefox veya Safari ile açın."); return; }

let S;
try { S = await (await fetch(BASE + "scene.json")).json(); }
catch (e) { fail("Sahne verisi yüklenemedi: " + e.message); return; }
if (!alive) return;

$("title").innerHTML = `${S.info.title}, <span>${S.info.accent}</span>`;
$("sub").textContent = `${S.info.sub} · ${S.W} × ${S.H} px`;
document.title = `${S.info.title} İzometrik`;
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const state = { traffic: !reduced, tilt: true, anim: !reduced, labels: true, mode: 0 };

// ------------------------------------------------------------ GL helpers
function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u };
}

const M = S.materials;
const PAL = { 0:[0,0,0], 1:[.78,.75,.70], 2:[.47,.72,.33], 3:[.27,.52,.24], 4:[.86,.84,.80], 5:[.30,.31,.34],
  6:[.95,.95,.9], 7:[.20,.52,.86], 8:[.55,.55,.58], 9:[.32,.66,.36], 10:[.66,.52,.36], 11:[.90,.82,.66],
  12:[.55,.45,.40], 20:[.93,.55,.30], 21:[.96,.82,.40], 22:[.16,.40,.16], 23:[.62,.40,.72], 24:[.95,.35,.45], 25:[.40,.75,.90] };
const palGLSL = Object.entries(PAL).map(([k, v]) => `if(m==${k}) return vec3(${v.map(x => x.toFixed(3)).join(",")});`).join("\n");

const mapP = prog(`#version 300 es
layout(location = 0) in vec2 aPos;
uniform vec4 uTile; uniform vec3 uCam; uniform vec2 uVP;
out vec2 vUV; out vec2 vMap;
void main(){
  vec2 m = uTile.xy + aPos * uTile.zw; vMap = m; vUV = aPos;
  vec2 s = (m - uCam.xy) * uCam.z + uVP * 0.5;
  gl_Position = vec4(s.x / uVP.x * 2.0 - 1.0, 1.0 - s.y / uVP.y * 2.0, 0.0, 1.0);
}`, `#version 300 es
precision highp float;
uniform sampler2D uC; uniform vec4 uTile; uniform vec2 uTexel; uniform ivec2 uTS;   // packed tile: colour on top, data below
uniform float uT; uniform float uAnim; uniform int uMode;
in vec2 vUV; in vec2 vMap; out vec4 o;
ivec2 dpx(vec2 uv){ return clamp(ivec2(uv * vec2(uTS)), ivec2(0), uTS - 1) + ivec2(0, uTS.y); }
int matAt(vec2 uv){ return int(texelFetch(uC, dpx(uv), 0).b * 255.0 + 0.5); }
float hAt(vec2 uv){ vec3 d = texelFetch(uC, dpx(uv), 0).rgb; return (floor(d.r * 255.0 + 0.5) * 256.0 + floor(d.g * 255.0 + 0.5)) / 100.0; }
vec3 col(vec2 uv){ return texture(uC, vec2(uv.x, clamp(uv.y, 0.0, 1.0 - 1.0 / float(uTS.y)) * 0.5)).rgb; }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
vec3 pal(int m){ ${palGLSL} return vec3(0.5); }
void main(){
  vec2 texel = uTexel;
  int m = matAt(vUV); float h = hAt(vUV);
  vec3 c = col(vUV);
  vec3 base = c;
  if (uAnim > 0.5) {
    if (m == 22) {
      float ph = sin(vMap.x * 0.031 + vMap.y * 0.017) * 3.0 + sin(vMap.x * 0.007 - vMap.y * 0.011) * 2.0;
      float sw = sin(uT * 1.6 + ph) + 0.45 * sin(uT * 2.9 + ph * 1.7);
      vec2 off = vec2(sw * 1.4, sw * 0.35) * texel;
      if (matAt(vUV - off) == 22) c = col(vUV - off);
      c *= 1.0 + 0.06 * sin(uT * 2.2 + ph * 2.3);
    } else if (m == 7) {
      float w = sin(vMap.x * 0.05 + vMap.y * 0.08 + uT * 1.1) + 0.6 * sin(vMap.x * 0.11 - vMap.y * 0.04 - uT * 0.7)
              + 0.4 * sin((vMap.x + vMap.y) * 0.21 + uT * 1.9);
      c += vec3(0.02, 0.03, 0.035) * w;
      vec2 cell = floor(vMap / 3.0);
      float s = hash(cell + floor(uT * 4.0));
      float fl = smoothstep(0.982, 1.0, s) * (0.55 + 0.45 * sin(uT * 18.0 + hash(cell) * 6.28));
      c += vec3(0.95) * fl;
    }
  }
  if (uMode == 1) {
    float v = clamp(h / 90.0, 0.0, 1.0);
    c = mix(vec3(0.08, 0.10, 0.14), mix(vec3(0.43, 0.35, 0.29), vec3(1.0, 0.85, 0.55), v), smoothstep(0.0, 0.5, v) + 0.25 * step(0.01, h));
    c *= 0.75 + 0.35 * dot(base, vec3(0.33));
  } else if (uMode == 2) {
    c = pal(m) * (0.45 + 0.75 * dot(base, vec3(0.299, 0.587, 0.114)));
  }
  if (m == 0) c = vec3(0.06, 0.07, 0.085);
  gl_FragDepth = 1.0 - clamp(h / 200.0, 0.0, 1.0) * 0.99 - 0.0005;
  o = vec4(c, 1.0);
}`);

const carP = prog(`#version 300 es
in vec2 aPos; in vec4 aCol; in float aDepth;
uniform vec3 uCam; uniform vec2 uVP;
out vec4 vCol;
void main(){
  vec2 s = (aPos - uCam.xy) * uCam.z + uVP * 0.5;
  gl_Position = vec4(s.x / uVP.x * 2.0 - 1.0, 1.0 - s.y / uVP.y * 2.0, aDepth * 2.0 - 1.0, 1.0);
  vCol = aCol;
}`, `#version 300 es
precision mediump float;
in vec4 vCol; out vec4 o;
void main(){ o = vCol; }`);

const postP = prog(`#version 300 es
layout(location = 0) in vec2 aPos; void main(){ gl_Position = vec4(aPos * 2.0 - 1.0, 0.0, 1.0); }`, `#version 300 es
precision highp float;
uniform sampler2D uS; uniform vec2 uRes; uniform float uTilt; uniform float uFocus; uniform float uMaxR;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float d = abs(uv.y - uFocus);
  float r = uTilt * uMaxR * smoothstep(0.12, 0.48, d);
  vec3 c;
  if (r < 0.6) c = texture(uS, uv).rgb;
  else {
    vec3 acc = vec3(0.0);
    for (int i = 0; i < 24; i++) {
      float fi = float(i);
      float a = fi * 2.39996;
      float rr = sqrt((fi + 0.5) / 24.0) * r;
      acc += texture(uS, uv + vec2(cos(a), sin(a)) * rr / uRes).rgb;
    }
    c = acc / 24.0;
  }
  if (uTilt > 0.5) {
    float l = dot(c, vec3(0.299, 0.587, 0.114));
    c = mix(vec3(l), c, 1.14);
    c = (c - 0.5) * 1.04 + 0.5;
    vec2 q = uv - 0.5; c *= 1.0 - 0.28 * dot(q, q);
  }
  o = vec4(clamp(c, 0.0, 1.0), 1.0);
}`);

// quad buffer
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]), gl.STATIC_DRAW);
const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindAttribLocation(mapP.p, 0, "aPos");

// ------------------------------------------------------------ textures
let loaded = 0;
async function texFrom(url, mip) {
  const blob = await (await fetch(url)).blob();
  const bmp = await createImageBitmap(blob, { premultiplyAlpha: "none", colorSpaceConversion: "none" });
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, bmp);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  if (mip) { gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); }
  else gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  bmp.close && bmp.close();
  return t;
}
const EXT = S.ext || "png";
// deep-zoom pyramid: level k = map downsampled 2^k, T x T tiles
const LV = S.levels, TOP = LV.length - 1, T = S.T;
const cache = new Map();      // "k/i/j" -> {k,i,j,x,y,w,h,tw,th,c,d,ready,used}
function tileInfo(k, i, j) {
  const L = LV[k], tw = Math.min(T, L.w - i * T), th = Math.min(T, L.h - j * T);
  return { k, i, j, x: i * T * L.s, y: j * T * L.s, w: tw * L.s, h: th * L.s, tw, th, ready: false, used: 0 };
}
let inflight = 0;
function request(k, i, j) {
  const key = `${k}/${i}/${j}`;
  if (cache.has(key)) return cache.get(key);
  const t = tileInfo(k, i, j); cache.set(key, t); inflight++;
  texFrom(`${BASE}t/${k}/${i}_${j}.${EXT}`, true)
    .then((c) => { t.c = c; t.ready = true; })
    .catch(() => { cache.delete(key); })
    .finally(() => { inflight--; });
  return t;
}
function evict() {
  const fine = [...cache.values()].filter((t) => t.k < TOP && t.ready);
  if (fine.length <= 110) return;
  fine.sort((a, b) => a.used - b.used);
  for (const t of fine.slice(0, fine.length - 110)) {
    gl.deleteTexture(t.c); cache.delete(`${t.k}/${t.i}/${t.j}`);
  }
}
try {
  const top = LV[TOP]; const jobs = [];
  for (let j = 0; j < top.ny; j++) for (let i = 0; i < top.nx; i++) {
    const t = tileInfo(TOP, i, j); cache.set(`${TOP}/${i}/${j}`, t);
    jobs.push(texFrom(`${BASE}t/${TOP}/${i}_${j}.${EXT}`, true)
      .then((c) => { t.c = c; t.ready = true; loaded++; loadEl.textContent = `Harita yükleniyor… ${loaded}/${top.nx * top.ny}`; }));
  }
  await Promise.all(jobs);
  if (!alive) return;
} catch (e) { fail("Harita karoları yüklenemedi: " + e.message); return; }
loadEl.remove();

// ------------------------------------------------------------ framebuffer
let fb, fbTex, fbDepth, W = 0, H = 0, dpr = 1, capK = 1;       // capK > 1 while a hi-res photo is being taken
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2) * capK;
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (w === W && h === H) return;
  const oldW = W; W = w; H = h; canvas.width = W; canvas.height = H;
  if (fb) { gl.deleteFramebuffer(fb); gl.deleteTexture(fbTex); gl.deleteRenderbuffer(fbDepth); }
  fbTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, fbTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  fbDepth = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, fbDepth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, W, H);
  fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fbTex, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, fbDepth);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (oldW) cam.z *= W / oldW;
}

// ------------------------------------------------------------ camera
const cam = { x: S.W / 2, y: S.H / 2, z: 1 };
resize();
const fitZ = () => Math.min(W / S.W, H / S.H);
const coverZ = () => Math.max(W / S.W, H / S.H);
cam.z = coverZ() * 1.25;
{ const sq = S.labels.find((l) => l.k === "square"); if (sq) { cam.x = sq.x * 0.55 + S.W / 2 * 0.45; cam.y = sq.y * 0.55 + S.H / 2 * 0.45; } }
// canvas px <-> world metres (ground plane), shared by all views of a city
const V = S.view, VH = V.heading * Math.PI / 180, VS = Math.sin(S.elev * Math.PI / 180);
const vr = [Math.cos(VH), -Math.sin(VH)], vf = [Math.sin(VH), Math.cos(VH)];
function pxToWorld(X, Y) {
  const xr = (X + V.origin[0]) * S.res, yr = -(Y + V.origin[1]) * S.res / VS;
  return [xr * vr[0] + yr * vf[0], xr * vr[1] + yr * vf[1]];
}
function worldToPx(x, y) {
  const xr = x * vr[0] + y * vr[1], yr = x * vf[0] + y * vf[1];
  return [xr / S.res - V.origin[0], -(yr * VS) / S.res - V.origin[1]];
}
if (keep) { const p = worldToPx(keep.x, keep.y); cam.x = p[0]; cam.y = p[1]; cam.z = keep.z * dpr; }
worldView = () => { const w = pxToWorld(cam.x, cam.y); return { x: w[0], y: w[1], z: cam.z / dpr }; };
const zMin = () => fitZ() * 0.9, zMax = () => 6 * dpr;
function clampCam() {
  cam.z = Math.min(Math.max(cam.z, zMin()), zMax());
  const hw = W / 2 / cam.z, hh = H / 2 / cam.z;
  cam.x = S.W > 2 * hw ? Math.min(Math.max(cam.x, hw), S.W - hw) : S.W / 2;
  cam.y = S.H > 2 * hh ? Math.min(Math.max(cam.y, hh), S.H - hh) : S.H / 2;
}
clampCam();
function zoomAt(f, sx, sy) {      // sx, sy in device px
  const mx = cam.x + (sx - W / 2) / cam.z, my = cam.y + (sy - H / 2) / cam.z;
  cam.z *= f; clampCam();
  cam.x = mx - (sx - W / 2) / cam.z; cam.y = my - (sy - H / 2) / cam.z; clampCam();
}

// pointer: drag, pinch, wheel
const ptrs = new Map(); let pinch = null; let focusY = 0.5, focusTarget = 0.5;
let tapStart = null;
canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); canvas.classList.add("drag");
  tapStart = ptrs.size === 1 ? [e.clientX, e.clientY, performance.now()] : null; });
canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") focusTarget = 1 - e.clientY / canvas.clientHeight;
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) { cam.x -= (e.clientX - prev[0]) * dpr / cam.z; cam.y -= (e.clientY - prev[1]) * dpr / cam.z; clampCam(); }
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const cx = (a[0] + b[0]) / 2 * dpr, cy = (a[1] + b[1]) / 2 * dpr;
    if (pinch) { zoomAt(d / pinch.d, cx, cy); cam.x -= (cx - pinch.cx) / cam.z; cam.y -= (cy - pinch.cy) / cam.z; clampCam(); }
    pinch = { d, cx, cy };

async function takePhoto() {
  if (shotBusy) return; shotBusy = true; swEl.classList.add("busy");
  const kk = swDims(), withLabels = $("sw-labels").checked, base = Math.min(window.devicePixelRatio || 1, 2);
  try {
    swStatus("Yüksek çözünürlüğe geçiliyor…");
    capK = kk / base; resize();
    await waitTiles(20000); if (!alive) return;
    swStatus("Görüntü alınıyor…");
    let out = null;
    capHook = () => { capHook = null;
      out = document.createElement("canvas"); out.width = W; out.height = H;
      const x = out.getContext("2d"); x.drawImage(canvas, 0, 0); drawOverlay(x, W / canvas.clientWidth, withLabels); };
    while (!out) await new Promise((r) => requestAnimationFrame(r));
    capK = 1; resize();
    swStatus("PNG hazırlanıyor…");
    const blob = await new Promise((r) => out.toBlob(r, "image/png"));
    swStatus(`Hazır: ${out.width} × ${out.height} px, ${(blob.size / 1048576).toFixed(1)} MB`);
    await saveFile(fileBase() + ".png", blob);
  } catch (e) { console.warn(e); swStatus("Fotoğraf alınamadı: " + (e.message || e)); }
  finally { if (capK !== 1) { capK = 1; resize(); } shotBusy = false; swEl.classList.remove("busy"); }
}
function pickMime() {
  if (!window.MediaRecorder) return null;
  for (const [m, ext] of [["video/mp4;codecs=avc1.640028", "mp4"], ["video/mp4;codecs=avc1", "mp4"], ["video/mp4", "mp4"],
                          ["video/webm;codecs=vp9", "webm"], ["video/webm;codecs=vp8", "webm"], ["video/webm", "webm"]])
    if (MediaRecorder.isTypeSupported(m)) return [m, ext];
  return null;
}
async function recordVideo() {
  if (shotBusy) return;
  const mm = pickMime(); if (!mm) { swStatus("Bu tarayıcı video kaydını desteklemiyor"); return; }
  shotBusy = true; swEl.classList.add("busy");
  const withLabels = $("sw-labels").checked, motion = swPressed("sw-motion").dataset.m, DUR = 4000;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  const s = Math.min(1920 / cw, 1920 / ch, W / cw);                  // up to 1920 px on the long side
  const comp = document.createElement("canvas");
  comp.width = Math.round(cw * s / 2) * 2; comp.height = Math.round(ch * s / 2) * 2;
  const x = comp.getContext("2d");
  const save = { x: cam.x, y: cam.y, z: cam.z };
  try {
    swStatus("Hazırlanıyor…"); await waitTiles(8000); if (!alive) return;
    const stream = comp.captureStream(30);
    const rec = new MediaRecorder(stream, { mimeType: mm[0], videoBitsPerSecond: 16e6 });
    const chunks = []; rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const done = new Promise((r) => { rec.onstop = r; });
    REC = { motion, x0: cam.x, y0: cam.y, z0: cam.z, t0: 0, dur: DUR };
    let started = false;
    await new Promise((resolve) => {
      capHook = (now) => {
        x.drawImage(canvas, 0, 0, comp.width, comp.height); drawOverlay(x, comp.width / cw, withLabels);
        if (!started) { started = true; REC.t0 = now; rec.start(250); }
        const el = now - REC.t0; swStatus(`Kaydediliyor… ${(Math.min(el, DUR) / 1000).toFixed(1)} / 4 sn`);
        if (el >= DUR) { capHook = null; REC = null; rec.stop(); resolve(); }
      };
    });
    await done;
    const blob = new Blob(chunks, { type: mm[0].split(";")[0] });
    swStatus(`Hazır: ${comp.width} × ${comp.height}, ${mm[1].toUpperCase()}, ${(blob.size / 1048576).toFixed(1)} MB`);
    await saveFile(fileBase() + "." + mm[1], blob);
  } catch (e) { console.warn(e); swStatus("Video kaydedilemedi: " + (e.message || e)); }
  finally { capHook = null; REC = null; cam.x = save.x; cam.y = save.y; cam.z = save.z; clampCam(); shotBusy = false; swEl.classList.remove("busy"); }
}
function recMotion(now) {
  if (!REC || !REC.t0) return;
  const p = Math.min(1, (now - REC.t0) / REC.dur), e = p * p * (3 - 2 * p);
  if (REC.motion === "zoom") cam.z = REC.z0 * Math.pow(1.3, e);
  else if (REC.motion === "pan") cam.x = REC.x0 + (e - 0.5) * 0.25 * W / REC.z0;
  else if (REC.motion === "orbit") { cam.x = REC.x0 + Math.sin(e * Math.PI) * 0.06 * W / REC.z0; cam.z = REC.z0 * (1 + 0.12 * Math.sin(e * Math.PI)); }
}
// window wiring (handlers are re-bound on every boot)
$("z-shot").onclick = () => { swEl.hidden = !swEl.hidden; $("z-shot").setAttribute("aria-expanded", String(!swEl.hidden)); if (!swEl.hidden) swDims(); };
$("sw-close").onclick = () => { swEl.hidden = true; $("z-shot").setAttribute("aria-expanded", "false"); };
for (const id of ["sw-scale", "sw-motion"]) swEl.querySelectorAll(`#${id} button`).forEach((b) => {
  b.onclick = () => { swEl.querySelectorAll(`#${id} button`).forEach((o) => o.setAttribute("aria-pressed", String(o === b))); swDims(); };
});
$("sw-photo").onclick = takePhoto;
$("sw-video").onclick = recordVideo;
{ const mm = pickMime(); $("sw-vfmt").textContent = mm ? `${mm[1].toUpperCase()}, en fazla 1920 px` : "Bu tarayıcıda desteklenmiyor"; $("sw-video").disabled = !mm; }
swStatus("");

// ------------------------------------------------------------ frame
function scaleBar() {
  const mPerCss = res / (cam.z / dpr);
  const target = mPerCss * 80;
  const nice = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find((v) => v >= target * 0.6) || 1000;
  $("scale-bar").style.width = Math.round(nice / mPerCss) + "px";
  $("scale-txt").textContent = nice >= 1000 ? nice / 1000 + " km" : nice + " m";
}
let last = performance.now(), t0 = last, uiTick = 0;
function frame(now) {
  if (!alive) return;
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (REC) recMotion(now);
  const t = (now - t0) / 1000;
  if (state.traffic) stepTraffic(dt);
  focusY += (focusTarget - focusY) * Math.min(1, dt * 4);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0.06, 0.07, 0.085, 1); gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.ALWAYS); gl.disable(gl.BLEND);

  gl.useProgram(mapP.p); gl.bindVertexArray(quadVAO);
  gl.uniform3f(mapP.u.uCam, cam.x, cam.y, cam.z); gl.uniform2f(mapP.u.uVP, W, H);
  gl.uniform1f(mapP.u.uT, t); gl.uniform1f(mapP.u.uAnim, state.anim ? 1 : 0); gl.uniform1i(mapP.u.uMode, state.mode);
  gl.uniform1i(mapP.u.uC, 0);
  const want = Math.min(TOP, Math.max(0, Math.floor(Math.log2(1 / cam.z) + 0.15)));
  const mx0 = cam.x - W / 2 / cam.z, mx1 = cam.x + W / 2 / cam.z, my0 = cam.y - H / 2 / cam.z, my1 = cam.y + H / 2 / cam.z;
  const drawTile = (tl) => {
    tl.used = now;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tl.c);
    gl.uniform4f(mapP.u.uTile, tl.x, tl.y, tl.w, tl.h); gl.uniform2f(mapP.u.uTexel, 1 / tl.tw, 1 / tl.th); gl.uniform2i(mapP.u.uTS, tl.tw, tl.th);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  };
  for (let k = TOP; k >= want; k--) {
    const L = LV[k], span = T * L.s;
    const i0 = Math.max(0, Math.floor(mx0 / span)), i1 = Math.min(L.nx - 1, Math.floor(mx1 / span));
    const j0 = Math.max(0, Math.floor(my0 / span)), j1 = Math.min(L.ny - 1, Math.floor(my1 / span));
    const need = [];
    if (k === TOP) lastMissing = 0;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const tl = cache.get(`${k}/${i}/${j}`);
      if (tl && tl.ready) drawTile(tl);
      else if (k === want && ++lastMissing && !tl) need.push([i, j, Math.hypot((i + 0.5) * span - cam.x, (j + 0.5) * span - cam.y)]);
    }
    need.sort((a, b) => a[2] - b[2]);
    for (const [i, j] of need) { if (inflight >= 8) break; request(k, i, j); }
  }
  if (uiTick % 60 === 0) evict();
  gl.depthFunc(gl.LESS);

  if (state.traffic && state.mode === 0) {
    buildCars();
    if (nv) {
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(carP.p); gl.bindVertexArray(carVAO); gl.bindBuffer(gl.ARRAY_BUFFER, carBuf);
      gl.bufferData(gl.ARRAY_BUFFER, verts.subarray(0, nv * 7), gl.STREAM_DRAW);
      gl.uniform3f(carP.u.uCam, cam.x, cam.y, cam.z); gl.uniform2f(carP.u.uVP, W, H);
      gl.drawArrays(gl.TRIANGLES, 0, nv);
      gl.disable(gl.BLEND);
    }
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H); gl.disable(gl.DEPTH_TEST);
  gl.useProgram(postP.p); gl.bindVertexArray(quadVAO);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbTex);
  gl.uniform1i(postP.u.uS, 0); gl.uniform2f(postP.u.uRes, W, H);
  gl.uniform1f(postP.u.uTilt, state.tilt && state.mode === 0 ? 1 : 0); gl.uniform1f(postP.u.uFocus, focusY);
  gl.uniform1f(postP.u.uMaxR, 7 * dpr);
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  placeLabels(); gameFrame(); infoFrame();
  if (capHook) capHook(now);
  if (++uiTick % 10 === 0) scaleBar();
  requestAnimationFrame(frame);
}
scaleBar();
requestAnimationFrame(frame);
}
if (location.protocol === "file:") boot(null, 0, null);
else fetch("cities.json").then((r) => r.json()).then((c) => { CITIES = c; const [city, vi] = parseHash(); switchTo(city, vi); })
  .catch((e) => { const d = document.createElement("div"); d.id = "load"; d.className = "err"; d.textContent = "Şehir listesi yüklenemedi: " + e.message; document.body.appendChild(d); });
</script>
