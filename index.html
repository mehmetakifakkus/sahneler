<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İzometrik Şehir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* One visual world: the map is the page; a dark glass panel floats over it.
   Accent = Ankara taxi yellow. */
:root {
  --ink: #0f1317;
  --panel: rgba(17, 21, 26, 0.84);
  --line: rgba(232, 228, 218, 0.12);
  --text: #ece8de;
  --muted: #9da6ab;
  --accent: #ecb428;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font-family: var(--font-body); overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#gl.drag { cursor: grabbing; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; transform-origin: 0 0; white-space: nowrap; font-weight: 600; font-size: 12px;
  letter-spacing: 0.01em; color: #1b1f24; background: rgba(250, 247, 240, 0.9); padding: 3px 7px; border-radius: 3px;
  box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.lbl.minor { font-weight: 500; font-size: 11px; padding: 2px 6px; }
.lbl.poi::after, .lbl.minor::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -4px; border: 4px solid transparent;
  border-top-color: rgba(250, 247, 240, 0.9); border-bottom: 0; }
.lbl.square { background: var(--accent); color: #1b1f24; }
.lbl.square::after { border-top-color: var(--accent); }
.lbl.water { background: none; box-shadow: none; color: #dff0ff; font-style: italic; font-weight: 500; font-size: 15px;
  letter-spacing: 0.12em; text-shadow: 0 1px 3px rgba(10,40,80,.9); padding: 0; }
.lbl.street { background: none; box-shadow: none; color: rgba(255,255,255,.92); font-weight: 500; font-size: 11px;
  text-shadow: 0 0 3px #222, 0 0 2px #222, 0 1px 2px #000; padding: 0; }

.panel { position: fixed; top: 16px; left: 16px; width: min(330px, calc(100vw - 32px)); background: var(--panel);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 16px 14px; display: grid; gap: 12px; box-sizing: border-box; }
.panel h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.panel h1 span { color: var(--accent); }
.sub { margin: 2px 0 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12.5px var(--font-body); color: var(--text); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 11px 6px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); box-sizing: border-box; }
.chip[aria-pressed="true"] { border-color: rgba(236, 180, 40, .55); background: rgba(236, 180, 40, .12); }
.chip[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg.two { grid-template-columns: 1fr 1fr; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button { font: 500 12.5px var(--font-body); color: var(--muted); background: transparent; border: 0; padding: 7px 4px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { color: #1b1f24; background: var(--text); }
.chip:focus-visible, .seg button:focus-visible, .zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: none; grid-template-columns: repeat(2, 1fr); gap: 4px 10px; font-size: 11.5px; color: var(--muted); }
.legend.on { display: grid; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.ramp { display: none; font: 11px var(--font-mono); color: var(--muted); }
.ramp.on { display: grid; gap: 4px; }
.ramp div:first-child { height: 8px; border-radius: 2px; background: linear-gradient(90deg, #141a24, #6d5a4a, #ffd98c); }
.ramp div:last-child { display: flex; justify-content: space-between; }
.stats { display: flex; justify-content: space-between; align-items: end; font: 11px var(--font-mono); color: var(--muted);
  font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); padding-top: 10px; }
.scale { display: grid; gap: 3px; }
.scale b { display: block; height: 4px; border: 1.5px solid var(--muted); border-top: 0; }
.note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
.note strong { color: var(--text); font-weight: 600; }
.zoom { position: fixed; right: 16px; top: 16px; display: grid; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.zoom button { width: 36px; height: 34px; font: 500 18px var(--font-body); color: var(--text); background: transparent; border: 0; cursor: pointer; }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button svg { display: block; margin: auto; }
.zoom button[aria-expanded="true"] { color: var(--accent); }
.shotwin { position: fixed; right: 16px; top: 140px; width: 280px; z-index: 7; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 12px; color: var(--text); box-shadow: 0 10px 28px rgba(0,0,0,.35);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 12.5px; box-sizing: border-box; }
.shotwin[hidden] { display: none; }
.shotwin header { display: flex; align-items: center; justify-content: space-between; }
.shotwin h3 { margin: 0; font: 600 14px var(--font-body); }
.shotwin #sw-close { background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; }
.sw-row { display: flex; flex-direction: column; gap: 6px; }
.sw-h { font: 500 11px var(--font-mono); color: var(--muted); }
.sw-row small { color: var(--muted); font: 500 11px var(--font-mono); }
.sw-go { font: 600 13px var(--font-body); color: #1b1f24; background: var(--accent); border: 0; border-radius: 7px; padding: 9px; cursor: pointer; }
.sw-go:disabled { opacity: .45; cursor: not-allowed; }
.shotwin.busy .sw-go { opacity: .5; pointer-events: none; }
.sw-chk { display: flex; gap: 7px; align-items: center; color: var(--muted); cursor: pointer; }
#sw-status { margin: 0; min-height: 1em; font: 500 11.5px var(--font-mono); color: var(--accent); }
#sw-status:empty { display: none; }
.attr { position: fixed; right: 10px; bottom: 8px; font-size: 11px; color: rgba(255,255,255,.85); text-shadow: 0 1px 2px #000; }
.attr a { color: inherit; }
#load { position: fixed; inset: 0; display: grid; place-items: center; font: 13px var(--font-mono); color: var(--muted); pointer-events: none; }
#load.err { color: #f2a28f; pointer-events: auto; padding: 24px; text-align: center; }
.collapse { display: none; }
.viewrow { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.viewrow button { height: 32px; font: 500 16px var(--font-body); color: var(--text); background: transparent; border: 0; cursor: pointer; }
.viewrow button:hover { background: rgba(255,255,255,.06); }
.viewrow span { text-align: center; font-size: 12.5px; color: var(--text); border-left: 1px solid var(--line); border-right: 1px solid var(--line); line-height: 32px; }
.viewrow button:disabled, .seg button:disabled { opacity: .4; cursor: not-allowed; }
.games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.games button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 6px !important; font-size: 12.5px !important; }
.games button svg { flex: none; }
/* compact header + icon tools */
.head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; }
.head .logo { display: grid; place-items: center; color: var(--accent); }
.head-t { min-width: 0; display: flex; flex-direction: column; }
.head-t h1 { font-size: 16px !important; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#v-name { font: 500 11px var(--font-mono); color: var(--muted); }
.rot { display: flex; gap: 4px; }
.tools { display: flex; justify-content: space-between; gap: 6px; }
.ibs { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; }
.ib { width: 32px; height: 30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font: 500 16px var(--font-body); }
.ib:hover { color: var(--text); background: rgba(255,255,255,.06); }
.ib[aria-pressed="true"] { color: var(--accent); background: rgba(236, 180, 40, .14); }
.seg-i .ib[aria-pressed="true"] { color: #1b1f24; background: var(--text); }
.ib:disabled { opacity: .35; cursor: not-allowed; }
.ib:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rot .ib { border: 1px solid var(--line); }
.games button { font: 600 12.5px var(--font-body); color: #1b1f24; background: var(--accent); border: 0; border-radius: 7px; padding: 8px 6px; cursor: pointer; }
.games button[aria-pressed="true"] { background: var(--text); }
.games .daily { background: transparent; color: var(--accent); border: 1px solid var(--accent); display: flex; justify-content: center; gap: 8px; align-items: baseline; }
.games .daily small { font: 500 11px var(--font-mono); opacity: .85; }
.games .daily[aria-pressed="true"] { background: var(--accent); color: #1b1f24; }
.game .sqs { font-size: 22px; letter-spacing: 4px; }
.game .copybox { width: 100%; box-sizing: border-box; font: 500 12px var(--font-mono); color: var(--text); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 7px; padding: 8px; }
.game.info .links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
.game { position: fixed; right: 16px; top: 140px; width: min(340px, calc(100vw - 32px)); background: var(--panel);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px; display: flex; flex-direction: column; box-sizing: border-box; z-index: 5; max-height: calc(100vh - 156px); }
.sheet-b { display: grid; gap: 10px; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
.sheet-b > h2:first-child, .sheet-b > .evkick:first-child { padding-right: 56px; }
.sheet-h { position: absolute; top: 9px; right: 9px; display: flex; align-items: center; gap: 2px; z-index: 1; }
.sheet-h .grab, .sheet-h .sheet-t { display: none; }
.sheet-h button { width: 26px; height: 26px; border: 0; border-radius: 6px; background: rgba(255,255,255,.06); color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0; }
.sheet-h button:hover { color: var(--text); background: rgba(255,255,255,.12); }
.game.min { padding-top: 10px; padding-bottom: 10px; }
.game.min .sheet-b { display: none; }
.game.min .sheet-h { position: static; cursor: pointer; }
.game.min .sheet-t { display: block; flex: 1; min-width: 0; font: 700 14px var(--font-body); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
.p-grab { display: none; }
.game[hidden] { display: none; }
.game h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.game h2 small { font: 500 11.5px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.game p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
.game p b { color: var(--text); }
.game canvas { width: 100%; aspect-ratio: 16 / 11; border-radius: 6px; background: #111; display: block; image-rendering: pixelated; }
.game .acts { display: flex; gap: 6px; justify-content: flex-end; }
.game .acts button { font: 600 12.5px var(--font-body); border-radius: 7px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
.game .acts button.primary { background: var(--accent); color: #1b1f24; border-color: var(--accent); }
.game .acts button:disabled { opacity: .45; cursor: not-allowed; }
.game .big { font: 700 26px var(--font-body); color: var(--accent); font-variant-numeric: tabular-nums; }
.game .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.game .bar i { display: block; height: 100%; background: var(--accent); }
#pins { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
#pins svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pin { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -18px 0 0 -9px; }
.pin::before { content: ""; position: absolute; inset: 0; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.pin.guess::before { background: #3b82f6; }
.pin.target::before { background: #e5484d; }
#crosshair { position: fixed; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 2px dashed rgba(255,255,255,.85);
  border-radius: 50%; pointer-events: none; z-index: 2; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
#crosshair[hidden] { display: none; }
.search { position: relative; }
.search input { width: 100%; box-sizing: border-box; font: 500 13px var(--font-body); color: var(--text); background: rgba(255,255,255,.06);
  border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search ul { position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: #161b21;
  border: 1px solid var(--line); border-radius: 8px; z-index: 8; max-height: 300px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.search ul[hidden] { display: none; }
.search li { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 7px 8px 7px 20px; border-radius: 5px;
  font-size: 13px; cursor: pointer; position: relative; }
.search li::before { content: ""; position: absolute; left: 7px; top: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--cc, #888); }
.search li:hover { background: rgba(255,255,255,.07); }
.search li small { color: var(--muted); font-size: 11px; white-space: nowrap; }
.search li.none { color: var(--muted); cursor: default; padding-left: 8px; }
.search li.none::before { display: none; }
.cats { display: flex; flex-direction: column; gap: 5px; }
.cats-row { display: flex; gap: 4px; flex-wrap: wrap; }
.cats-row[hidden] { display: none; }
.cats-cap { font: 500 11px var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 14px; }
.cats-cap b { font-family: var(--font-body); font-weight: 600; color: var(--text); margin-right: 4px; }
.cats[hidden] { display: none; }

.lbl.link { pointer-events: auto; cursor: pointer; }
.cat { position: relative; width: 33px; height: 32px; padding: 0; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px;
  cursor: pointer; display: inline-grid; place-items: center; font: 600 12px var(--font-body); }
.cat .cat-l, .cat small { display: none; }
.cat:hover { color: var(--text); border-color: var(--cc, var(--muted)); }
.cat[aria-pressed="true"] { color: var(--cc); border-color: color-mix(in srgb, var(--cc) 60%, transparent); background: color-mix(in srgb, var(--cc) 16%, transparent); }
.cat.more { font: 600 11.5px var(--font-mono); }
.cat.more i { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.cat.more i[hidden] { display: none; }
.cat.more[aria-expanded="true"] { color: var(--text); border-color: var(--muted); background: rgba(255,255,255,.06); }
.lbl.feat { pointer-events: auto; cursor: pointer; border: 0; font: 600 11px var(--font-body); padding: 2px 7px 2px 16px; background: rgba(250,247,240,.92); }
.lbl.feat::before { content: ""; position: absolute; left: 6px; top: 50%; margin-top: -3.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--cc); }
.lbl.feat:hover { background: #fff; }
.game.info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12.5px; }
.game.info dt { color: var(--muted); }
.game.info dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.game.info a { color: var(--accent); }
.game.info .est { color: var(--muted); font-size: 11px; }
.game.info .acts { align-items: center; justify-content: space-between; }
.game.info .acts a { font-size: 12px; }
.game.info .chip-c { margin: 0; font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; }
.chip-c::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--cc); }
.near { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.near span { font: 500 11px var(--font-mono); color: var(--muted); width: 100%; }
.near button { font: 500 11.5px var(--font-body); color: var(--text); background: rgba(255,255,255,.05); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 9px 4px 8px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.near button::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cc); }
.near small { color: var(--muted); font-size: 10.5px; }
.pin.sel::before { background: var(--accent); }
.editbar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 9; display: flex; gap: 10px; align-items: center;
  background: #2a2412; color: #f4e7c0; border: 1px solid #8a6d1d; border-radius: 10px; padding: 7px 8px 7px 14px; font: 500 12.5px var(--font-body);
  box-shadow: 0 6px 20px rgba(0,0,0,.35); max-width: calc(100vw - 24px); flex-wrap: wrap; }
.editbar b { color: var(--accent); }
.editbar .eb-hint { color: #cdbd90; }
.editbar #e-count { font: 500 11px var(--font-mono); color: #cdbd90; }
.editbar button { font: 600 12px var(--font-body); color: #1d1a10; background: var(--accent); border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.editbar #e-clear, .editbar #e-exit { background: transparent; color: #f4e7c0; border: 1px solid #8a6d1d; }
@media (max-width: 560px) { .editbar { top: 8px; left: 10px; right: 10px; transform: none; gap: 5px; padding: 6px 8px; flex-wrap: nowrap; overflow-x: auto; }
  .editbar .eb-hint, .editbar #e-count { display: none; } .editbar button { padding: 5px 8px; white-space: nowrap; font-size: 11.5px; } }
.game.info .sub { margin: -4px 0 0; color: var(--muted); font-size: 11.5px; }
.game.info .fld { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--muted); }
.game.info .fld input, .game.info .fld select, .game.info .fld textarea { font: 500 13px var(--font-body); color: var(--text); background: rgba(255,255,255,.06);
  border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; outline: none; resize: vertical; }
.game.info .fld select option { background: #161b21; }
.game.info .fld :focus { border-color: var(--accent); }
.game.info .linkbtn { background: none; border: 0; color: var(--accent); font-size: 12px; text-align: left; padding: 0; cursor: pointer; }
.game.info .acts .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
/* events */
.picking .lbl, .picking .evpin { pointer-events: none !important; }
.picking canvas { cursor: crosshair; }
.evbox { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.evpin { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; align-items: center; gap: 6px; transform-origin: 0 0;
  margin: -34px 0 0 -14px; padding: 3px 9px 3px 3px; border: 0; border-radius: 999px; background: #fffdf6; color: #1b1f24; cursor: pointer;
  font: 700 12px var(--font-body); box-shadow: 0 3px 10px rgba(0,0,0,.35), 0 0 0 2px var(--cc); white-space: nowrap; }
.evbox.compact .evpin { padding-right: 3px; }
.evbox.compact .evpin span { display: none; }
.evbox.compact .evpin:hover span { display: inline; }
.evpin b { width: 22px; height: 22px; border-radius: 50%; background: var(--cc); color: #fff; display: grid; place-items: center; font-size: 12px; }
.evpin::after { content: ""; position: absolute; left: 10px; top: 100%; border: 6px solid transparent; border-top-color: var(--cc); }
.evpin:hover { transform-origin: 0 0; filter: brightness(1.05); box-shadow: 0 4px 14px rgba(0,0,0,.45), 0 0 0 3px var(--cc); }
.evtip { position: fixed; z-index: 8; width: 320px; max-height: 60vh; overflow: hidden; background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; box-shadow: 0 10px 28px rgba(0,0,0,.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 12.5px; pointer-events: none; }
.evtip[hidden] { display: none; }
.evtip h4 { margin: 0 0 6px; font: 700 14px var(--font-body); display: flex; gap: 8px; align-items: center; }
.evtip h4::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--cc); }

onTap = (x, y) => {

let capHook = null, REC = null, lastMissing = 0, shotBusy = false;
async function saveFile(name, blob) {

  return true;
}
const stamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };
const fileBase = () => `${city}-${CITIES[city].views[vi].h}-${stamp()}`;
function drawOverlay(x, s, withLabels) {
  x.save(); x.scale(s, s);
  if (withLabels && labelBox.style.display !== "none") {
    for (const el of labelBox.children) {
      if (el.style.display === "none" || !el.textContent) continue;
      const m = /translate\(([-\d.]+)px, ([-\d.]+)px\)/.exec(el.style.transform); if (!m) continue;
      const lx = +m[1], ly = +m[2], w = el.offsetWidth, h = el.offsetHeight;
      if (lx > canvas.clientWidth || ly > canvas.clientHeight || lx + w < 0 || ly + h < 0) continue;
      const cs = el._cs || (el._cs = getComputedStyle(el));
      const bg = cs.backgroundColor, hasBg = bg && !/rgba\(0, 0, 0, 0\)|transparent/.test(bg);
      if (hasBg) {
        x.fillStyle = "rgba(0,0,0,.25)"; x.beginPath(); x.roundRect(lx, ly + 1, w, h, 3); x.fill();
        x.fillStyle = bg; x.beginPath(); x.roundRect(lx, ly, w, h, 3); x.fill();
        if (el.classList.contains("poi") || el.classList.contains("minor") || el.classList.contains("square")) {
          x.beginPath(); x.moveTo(lx + w / 2 - 4, ly + h); x.lineTo(lx + w / 2 + 4, ly + h); x.lineTo(lx + w / 2, ly + h + 4); x.fill();
        }
      }
      if (el.classList.contains("feat")) {
        x.fillStyle = el.style.getPropertyValue("--cc") || "#888"; x.beginPath(); x.arc(lx + 9.5, ly + h / 2, 3.5, 0, Math.PI * 2); x.fill();
      }
      x.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      if ("letterSpacing" in x) x.letterSpacing = cs.letterSpacing === "normal" ? "0px" : cs.letterSpacing;
      x.textBaseline = "middle"; x.fillStyle = cs.color;
      if (cs.textShadow && cs.textShadow !== "none") { x.shadowColor = "rgba(0,0,0,.85)"; x.shadowBlur = 3; x.shadowOffsetY = 1; }
      x.fillText(el.textContent, lx + parseFloat(cs.paddingLeft || 0), ly + h / 2 + 0.5);
      x.shadowColor = "transparent"; x.shadowBlur = 0; x.shadowOffsetY = 0;

  const t = "Harita verisi © OpenStreetMap katkıcıları (ODbL)";
  x.font = "500 11px system-ui, sans-serif"; x.textAlign = "right"; x.textBaseline = "alphabetic";
  x.shadowColor = "rgba(0,0,0,.9)"; x.shadowBlur = 3; x.fillStyle = "rgba(255,255,255,.9)";

}
const nextHook = () => new Promise((res) => { capHook = () => { capHook = null; res(); }; });
async function waitTiles(maxMs) {
  const t0 = performance.now(); let ok = 0;
  while (performance.now() - t0 < maxMs) {
    await nextHook(); if (!alive) return;
    ok = lastMissing === 0 && inflight === 0 ? ok + 1 : 0;
    if (ok >= 3) return;
    swStatus(`Ayrıntılar yükleniyor… ${lastMissing ? lastMissing + " parça" : ""}`);
  }
}
const swEl = $("shotwin"), swStatus = (m) => { $("sw-status").textContent = m; };
const swPressed = (id) => swEl.querySelector(`#${id} [aria-pressed="true"]`);
function swDims() {
  const k = +swPressed("sw-scale").dataset.k, cw = canvas.clientWidth, ch = canvas.clientHeight;
  const maxD = Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), gl.getParameter(gl.MAX_TEXTURE_SIZE), gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0], 8192);
  const kk = Math.min(k, maxD / cw, maxD / ch);
  $("sw-dims").textContent = `${Math.round(cw * kk)} × ${Math.round(ch * kk)} px`;
  return kk;
}
async function takePhoto() {
  if (shotBusy) return; shotBusy = true; swEl.classList.add("busy");
  const kk = swDims(), withLabels = $("sw-labels").checked, base = Math.min(window.devicePixelRatio || 1, 2);
  try {
    swStatus("Yüksek çözünürlüğe geçiliyor…");
    capK = kk / base; resize();
    await waitTiles(20000); if (!alive) return;
    swStatus("Görüntü alınıyor…");
    let out = null;
    capHook = () => { capHook = null;
      out = document.createElement("canvas"); out.width = W; out.height = H;
      const x = out.getContext("2d"); x.drawImage(canvas, 0, 0); drawOverlay(x, W / canvas.clientWidth, withLabels); };
    while (!out) await new Promise((r) => requestAnimationFrame(r));
    capK = 1; resize();
    swStatus("PNG hazırlanıyor…");
    const blob = await new Promise((r) => out.toBlob(r, "image/png"));
    swStatus(`Hazır: ${out.width} × ${out.height} px, ${(blob.size / 1048576).toFixed(1)} MB`);
    await saveFile(fileBase() + ".png", blob);
  } catch (e) { console.warn(e); swStatus("Fotoğraf alınamadı: " + (e.message || e)); }
  finally { if (capK !== 1) { capK = 1; resize(); } shotBusy = false; swEl.classList.remove("busy"); }
}
function pickMime() {
  if (!window.MediaRecorder) return null;
  for (const [m, ext] of [["video/mp4;codecs=avc1.640028", "mp4"], ["video/mp4;codecs=avc1", "mp4"], ["video/mp4", "mp4"],
                          ["video/webm;codecs=vp9", "webm"], ["video/webm;codecs=vp8", "webm"], ["video/webm", "webm"]])
    if (MediaRecorder.isTypeSupported(m)) return [m, ext];
  return null;
}
async function recordVideo() {
  if (shotBusy) return;
  const mm = pickMime(); if (!mm) { swStatus("Bu tarayıcı video kaydını desteklemiyor"); return; }
  shotBusy = true; swEl.classList.add("busy");
  const withLabels = $("sw-labels").checked, motion = swPressed("sw-motion").dataset.m, DUR = 4000;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  const s = Math.min(1920 / cw, 1920 / ch, W / cw);                  // up to 1920 px on the long side
  const comp = document.createElement("canvas");
  comp.width = Math.round(cw * s / 2) * 2; comp.height = Math.round(ch * s / 2) * 2;
  const x = comp.getContext("2d");
  const save = { x: cam.x, y: cam.y, z: cam.z };
  try {
    swStatus("Hazırlanıyor…"); await waitTiles(8000); if (!alive) return;
    const stream = comp.captureStream(30);
    const rec = new MediaRecorder(stream, { mimeType: mm[0], videoBitsPerSecond: 16e6 });
    const chunks = []; rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const done = new Promise((r) => { rec.onstop = r; });
    REC = { motion, x0: cam.x, y0: cam.y, z0: cam.z, t0: 0, dur: DUR };
    let started = false;
    await new Promise((resolve) => {
      capHook = (now) => {
        x.drawImage(canvas, 0, 0, comp.width, comp.height); drawOverlay(x, comp.width / cw, withLabels);
        if (!started) { started = true; REC.t0 = now; rec.start(250); }
        const el = now - REC.t0; swStatus(`Kaydediliyor… ${(Math.min(el, DUR) / 1000).toFixed(1)} / 4 sn`);
        if (el >= DUR) { capHook = null; REC = null; rec.stop(); resolve(); }
      };
    });
    await done;
    const blob = new Blob(chunks, { type: mm[0].split(";")[0] });
    swStatus(`Hazır: ${comp.width} × ${comp.height}, ${mm[1].toUpperCase()}, ${(blob.size / 1048576).toFixed(1)} MB`);
    await saveFile(fileBase() + "." + mm[1], blob);
  } catch (e) { console.warn(e); swStatus("Video kaydedilemedi: " + (e.message || e)); }
  finally { capHook = null; REC = null; cam.x = save.x; cam.y = save.y; cam.z = save.z; clampCam(); shotBusy = false; swEl.classList.remove("busy"); }
}
function recMotion(now) {
  if (!REC || !REC.t0) return;
  const p = Math.min(1, (now - REC.t0) / REC.dur), e = p * p * (3 - 2 * p);
  if (REC.motion === "zoom") cam.z = REC.z0 * Math.pow(1.3, e);
  else if (REC.motion === "pan") cam.x = REC.x0 + (e - 0.5) * 0.25 * W / REC.z0;
  else if (REC.motion === "orbit") { cam.x = REC.x0 + Math.sin(e * Math.PI) * 0.06 * W / REC.z0; cam.z = REC.z0 * (1 + 0.12 * Math.sin(e * Math.PI)); }
}
// window wiring (handlers are re-bound on every boot)
$("z-shot").onclick = () => { swEl.hidden = !swEl.hidden; $("z-shot").setAttribute("aria-expanded", String(!swEl.hidden)); if (!swEl.hidden) swDims(); };
$("sw-close").onclick = () => { swEl.hidden = true; $("z-shot").setAttribute("aria-expanded", "false"); };
for (const id of ["sw-scale", "sw-motion"]) swEl.querySelectorAll(`#${id} button`).forEach((b) => {
  b.onclick = () => { swEl.querySelectorAll(`#${id} button`).forEach((o) => o.setAttribute("aria-pressed", String(o === b))); swDims(); };
});
$("sw-photo").onclick = takePhoto;
$("sw-video").onclick = recordVideo;
{ const mm = pickMime(); $("sw-vfmt").textContent = mm ? `${mm[1].toUpperCase()}, en fazla 1920 px` : "Bu tarayıcıda desteklenmiyor"; $("sw-video").disabled = !mm; }
swStatus("");

// ------------------------------------------------------------ frame
function scaleBar() {
  const mPerCss = res / (cam.z / dpr);
  const target = mPerCss * 80;
  const nice = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find((v) => v >= target * 0.6) || 1000;
  $("scale-bar").style.width = Math.round(nice / mPerCss) + "px";
  $("scale-txt").textContent = nice >= 1000 ? nice / 1000 + " km" : nice + " m";
}
let last = performance.now(), t0 = last, uiTick = 0;
function frame(now) {
  if (!alive) return;
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (REC) recMotion(now);
  const t = (now - t0) / 1000;
  if (state.traffic) stepTraffic(dt);
  focusY += (focusTarget - focusY) * Math.min(1, dt * 4);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0.06, 0.07, 0.085, 1); gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.ALWAYS); gl.disable(gl.BLEND);

  gl.useProgram(mapP.p); gl.bindVertexArray(quadVAO);
  gl.uniform3f(mapP.u.uCam, cam.x, cam.y, cam.z); gl.uniform2f(mapP.u.uVP, W, H);
  gl.uniform1f(mapP.u.uT, t); gl.uniform1f(mapP.u.uAnim, state.anim ? 1 : 0); gl.uniform1i(mapP.u.uMode, state.mode);
  gl.uniform1i(mapP.u.uC, 0);
  const want = Math.min(TOP, Math.max(0, Math.floor(Math.log2(1 / cam.z) + 0.15)));
  const mx0 = cam.x - W / 2 / cam.z, mx1 = cam.x + W / 2 / cam.z, my0 = cam.y - H / 2 / cam.z, my1 = cam.y + H / 2 / cam.z;
  const drawTile = (tl) => {
    tl.used = now;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tl.c);
    gl.uniform4f(mapP.u.uTile, tl.x, tl.y, tl.w, tl.h); gl.uniform2f(mapP.u.uTexel, 1 / tl.tw, 1 / tl.th); gl.uniform2i(mapP.u.uTS, tl.tw, tl.th);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

  for (let k = TOP; k >= want; k--) {
    const L = LV[k], span = T * L.s;
    const i0 = Math.max(0, Math.floor(mx0 / span)), i1 = Math.min(L.nx - 1, Math.floor(mx1 / span));
    const j0 = Math.max(0, Math.floor(my0 / span)), j1 = Math.min(L.ny - 1, Math.floor(my1 / span));
    const need = [];

      const tl = cache.get(`${k}/${i}/${j}`);
      if (tl && tl.ready) drawTile(tl);
      else if (k === want && ++lastMissing && !tl) need.push([i, j, Math.hypot((i + 0.5) * span - cam.x, (j + 0.5) * span - cam.y)]);

      gl.useProgram(carP.p); gl.bindVertexArray(carVAO); gl.bindBuffer(gl.ARRAY_BUFFER, carBuf);

}
